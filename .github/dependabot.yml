version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Group all patch and minor bumps into a single PR per week.
      # Major bumps still arrive individually because they need
      # individual review and a live verifier run before merge.
      python-minor-and-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      # PyModbus 3.7+ renamed ModbusSlaveContext -> ModbusDeviceContext
      # and changed ModbusServerContext(slaves=) -> ModbusServerContext(devices=).
      # Bumping past 3.6.x requires coordinated changes across
      # plc_simulator/modbus_server.py, backend/api.py, the remediation
      # engine, and every verifier probe. Block automatic bumps; require
      # a manual upgrade branch plus a full live verifier run before merge.
      - dependency-name: "pymodbus"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

      # websockets 17.x is backwards-incompatible with uvicorn 0.53
      # (non-ASCII header handling changed upstream). The pip resolver
      # fails when Dependabot bumps websockets to 17.x against uvicorn's
      # pinned range. Block major bumps until uvicorn ships support.
      - dependency-name: "websockets"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    ignore:
      # Actions v7 (checkout, setup-python) migrated to ESM for Node.js 24
      # compatibility and changed cache-restore behaviour. Bumping both
      # actions at once turned main red with no clear signal about which
      # one broke. Block automatic major bumps until each is verified
      # against the workflow manually.
      - dependency-name: "actions/checkout"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "actions/setup-python"
        update-types:
          - "version-update:semver-major"