version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Ignore major version bumps for core actions to prevent instability
      # v7 of checkout/setup-python has known compatibility issues with current runner images
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-python"
        update-types: ["version-update:semver-major"]

  # Maintain dependencies for pip
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Group minor and patch updates to reduce PR noise
      python-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "llama-cpp-python" # Handle manually due to wheel complexity
          - "websockets"       # Handled explicitly below
    ignore:
      # CRITICAL: websockets 17.x is incompatible with uvicorn 0.53 / fastapi current pin
      # This prevents the "Install dependencies" CI failure
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]
      
      # llama-cpp-python requires manual wheel installation on Windows/Linux CI
      # Auto-bumping often fails because pre-built wheels aren't always available instantly
      - dependency-name: "llama-cpp-python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]