version: 2
updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    ignore:
      # Block major bumps for core actions to prevent ESM/Node.js compatibility breaks
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-python"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # Python Dependencies (pip)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    
    groups:
      # Group minor/patch updates for NON-CRITICAL packages only.
      # We exclude the frozen core stack below.
      python-non-core-updates:
        patterns:
          - "*"
        exclude-patterns:
          # FROZEN CORE WEB STACK (Manual Upgrade Required)
          - "fastapi"
          - "starlette"
          - "uvicorn"
          - "pydantic"
          - "pydantic-core"
          
          # FROZEN DATA SCIENCE (Python Version Constraints)
          - "numpy"
          - "pandas"
          - "scipy"
          
          # SPECIAL HANDLING REQUIRED
          - "llama-cpp-python"
          - "websockets"
          - "pymodbus"

    ignore:
      # CRITICAL: websockets 17.x is incompatible with uvicorn 0.53
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]

      # CRITICAL: NumPy 2.5+ requires Python >= 3.12. CI is 3.11.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

      # CRITICAL: PyModbus 3.7+ has breaking API changes (Slave->Device)
      - dependency-name: "pymodbus"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

      # MANUAL WHEEL INSTALLATION REQUIRED
      - dependency-name: "llama-cpp-python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

      # FROZEN STACK: Prevent Dependabot from touching these at all.
      # Upgrades must be done manually after verifying full compatibility.
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      
      - dependency-name: "starlette"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      
      - dependency-name: "uvicorn"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      
      - dependency-name: "pydantic-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]