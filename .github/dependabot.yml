version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Group all patch and minor bumps into a single PR per week.
      # Major bumps still arrive individually, because they need
      # individual review. This reduces the weekly flood from seven
      # PRs to one routine PR + any major-version PRs.
      python-minor-and-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      # PyModbus 3.7+ renamed ModbusSlaveContext -> ModbusDeviceContext
      # and changed ModbusServerContext(slaves=) -> ModbusServerContext(devices=).
      # Bumping past 3.6.x requires coordinated changes across
      # plc_simulator/modbus_server.py, backend/api.py, the remediation
      # engine, and every verifier probe. Block automatic bumps; require
      # a manual upgrade branch plus a full live verifier run before merge.
      - dependency-name: "pymodbus"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"