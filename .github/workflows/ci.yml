# NEXUS SCADA — Continuous Integration
#
# Scope:
#   - Byte-compile, unit tests, and import smoke test on every push / PR
#     to main.
#   - Does NOT run tests/quick_test.py --live: that requires a live PLC
#     simulator, a running FastAPI backend, and a 1.4 GB GGUF model,
#     none of which are available on GitHub-hosted runners.
#   - Installs requirements-ci.txt (requirements.txt minus
#     llama-cpp-python) because llama-cpp-python cannot be built from
#     source on GitHub-hosted Ubuntu runners.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Byte-compile all Python sources
        run: |
          python -m compileall -q backend models plc_simulator dashboard hmi tests tools scripts

      - name: Run unit test suite
        run: |
          python -m pytest tests/ -q --no-header --ignore=tests/quick_test.py

      - name: Import smoke test (catches syntax + import-time regressions)
        run: |
          python - <<'PY'
          import importlib, sys

          # Import targets that do not require the LLM. The LLM is absent
          # in CI (see requirements-ci.txt); modules that hard-import
          # llama-cpp-python at import time must not be listed here.
          targets = [
              "backend.database",
              "obsidian_bridge",
          ]

          sys.path.insert(0, ".")
          sys.path.insert(0, "backend")
          sys.path.insert(0, "models")

          failed = []
          for name in targets:
              try:
                  importlib.import_module(name)
                  print(f"[ok]   {name}")
              except Exception as exc:
                  print(f"[FAIL] {name}: {type(exc).__name__}: {exc}")
                  failed.append(name)

          if failed:
              sys.exit(1)
          PY