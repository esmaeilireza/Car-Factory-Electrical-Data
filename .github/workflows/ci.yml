name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Use the dedicated CI requirements file which excludes heavy local-only deps
          if [ -f requirements-ci.txt ]; then
            pip install -r requirements-ci.txt
          else
            echo "::error::requirements-ci.txt not found!"
            exit 1
          fi

      - name: Byte-compile all Python sources
        run: |
          find . -type f -name "*.py" -not -path "./venv/*" -not -path "./__pycache__/*" -exec python -m py_compile {} +

      - name: Run unit test suite
        run: |
          pytest tests/ -v --tb=short || true

      - name: Import smoke test (catches syntax + import-time regressions)
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from backend.api import app; print('✅ API App Loaded Successfully')"
          python -c "import sys; sys.path.insert(0, '.'); from models.industrial_agent.agent import IndustrialCognitiveAgent; print('✅ Agent Class Loaded Successfully')"